name: Self-test verify action

on:
  push:
  workflow_dispatch:

jobs:
  gold-patch:
    name: gold patch must resolve (${{ matrix.task }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - task: sympy__sympy-11400
            gold: tasks/sympy-11400-gold_patch.diff
          - task: django__django-10914
            gold: tasks/django-10914-gold_patch.diff
          - task: matplotlib__matplotlib-18869
            gold: tasks/matplotlib-18869-gold_patch.diff
    steps:
      - uses: actions/checkout@v4
      - uses: ./
        with:
          task: ${{ matrix.task }}
          patch: ${{ matrix.gold }}

  empty-patch:
    name: empty patch must be not_resolved (${{ matrix.task }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        task:
          - sympy__sympy-11400
          - django__django-10914
          - matplotlib__matplotlib-18869
    steps:
      - uses: actions/checkout@v4
      - name: Create an empty patch
        run: ": > \"$RUNNER_TEMP/empty.diff\""
      - id: verify
        uses: ./
        continue-on-error: true
        with:
          task: ${{ matrix.task }}
          patch: ${{ runner.temp }}/empty.diff
      - name: Assert the action failed with not_resolved
        env:
          OUTCOME: ${{ steps.verify.outcome }}
          VERDICT: ${{ steps.verify.outputs.verdict }}
        run: |
          echo "outcome=$OUTCOME verdict=$VERDICT"
          test "$OUTCOME" = failure
          test "$VERDICT" = not_resolved
